<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your driver &middot; TPT Black Car</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#3B1412">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
        integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css?v=55">
  <link rel="stylesheet" href="admin.css?v=9">
  <link rel="stylesheet" href="mobile.css?v=1" media="(max-width: 48rem)">
</head>
<body class="admin">

<header class="admin-bar">
  <div class="admin-bar-in">
    <a class="admin-brand" href="/">
      <img src="assets/mark.svg" alt="TPT" width="44" height="25">
      <span>Your driver</span>
    </a>
    <a class="btn btn-quiet btn-sm" href="tel:+18649016550">Call TPT</a>
  </div>
</header>

<main class="frame admin-main trk-main">

  <p class="desk-note" id="loading">Finding your trip&hellip;</p>

  <section class="panel cancel-panel" id="problem" data-tone="light" hidden>
    <h1 id="problem-title">We could not open that</h1>
    <p class="lead" id="problem-text"></p>
    <p><a class="btn btn-action" href="tel:+18649016550">Call 864-901-6550</a></p>
  </section>

  <section id="view" hidden>
    <div class="trk-status" role="status" aria-live="polite">
      <span class="label num" id="ref"></span>
      <h1 id="headline"></h1>
      <p class="lead" id="subline"></p>
    </div>

    <div class="trk-map-wrap" id="map-wrap" hidden>
      <div id="map" class="trk-map" role="img" aria-label="Map showing your driver and your pickup"></div>
      <p class="trk-updated" id="updated"></p>
    </div>

    <div class="res trk-card" id="card" data-tone="light">
      <span class="label">Pickup</span>
      <p class="trk-pickup" id="pickup"></p>
      <p class="trk-when num" id="when"></p>
      <div class="trk-actions">
        <a class="btn btn-action btn-sm" id="call" href="tel:+18649016550">Call</a>
        <a class="btn btn-quiet btn-sm" id="text" href="sms:+18649016550">Text</a>
      </div>
    </div>

    <p class="desk-note trk-privacy">Only you have this link. It shows your driver until they reach your pickup, never the ride itself, and stops working after your trip.</p>
  </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
<script src="config.js?v=2"></script>
<script src="track.js?v=2"></script>
</body>
</html>
