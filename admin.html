<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reservations &middot; TPT Black Car</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#3B1412">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="admin.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=32">
  <link rel="stylesheet" href="admin.css?v=5">
</head>
<body class="admin">

<header class="admin-bar">
  <div class="admin-bar-in">
    <a class="admin-brand" href="/">
      <img src="assets/mark.svg" alt="TPT" width="44" height="25">
      <span>Reservations</span>
    </a>
    <button type="button" class="btn btn-quiet btn-sm" id="signout" hidden>Sign out</button>
  </div>
</header>

<main class="frame admin-main">

  <!-- Passcode gate -->
  <section class="panel admin-gate" id="gate" data-tone="dark" hidden>
    <h1>Owner sign-in</h1>
    <p class="lead">Reservations, quotes and confirmations.</p>
    <form id="gate-form">
      <div class="field">
        <label for="passcode">Passcode</label>
        <input id="passcode" name="passcode" type="password" autocomplete="current-password"
               inputmode="text" autocapitalize="off" spellcheck="false" required>
      </div>
      <button type="submit" class="btn btn-action btn-block" id="gate-btn">Sign in</button>
      <p class="form-error" id="gate-error" role="alert" hidden></p>
    </form>
  </section>

  <!-- The desk -->
  <section class="admin-desk" id="desk" hidden>
    <div class="chips desk-tabs" id="tabs" role="group" aria-label="What to work on">
      <label><input type="radio" name="tab" value="trips" checked><span>Reservations</span></label>
      <label><input type="radio" name="tab" value="reviews"><span>Reviews <b id="pending-count">0</b></span></label>
    </div>

    <div class="desk-pane" id="pane-trips">
    <div class="desk-top">
      <div class="chips" id="filters" role="group" aria-label="Filter reservations">
        <label><input type="radio" name="filter" value="Upcoming" checked><span>Upcoming <b data-count="Upcoming">0</b></span></label>
        <label><input type="radio" name="filter" value="New"><span>New <b data-count="New">0</b></span></label>
        <label><input type="radio" name="filter" value="Quoted"><span>Quoted <b data-count="Quoted">0</b></span></label>
        <label><input type="radio" name="filter" value="Confirmed"><span>Confirmed <b data-count="Confirmed">0</b></span></label>
        <label><input type="radio" name="filter" value="All"><span>All <b data-count="All">0</b></span></label>
      </div>
      <button type="button" class="btn btn-quiet btn-sm" id="refresh">Refresh</button>
    </div>

    <p class="desk-note" id="desk-note" role="status" aria-live="polite" hidden></p>
    <div id="list" class="res-list"></div>
    <p class="desk-empty" id="empty" hidden>Nothing here yet.</p>
    </div>

    <!-- Reviews: nothing a rider writes reaches the website until it is approved here. -->
    <div class="desk-pane" id="pane-reviews" hidden>
      <div class="desk-top">
        <div class="chips" id="rv-filters" role="group" aria-label="Filter reviews">
          <label><input type="radio" name="rvfilter" value="Pending" checked><span>Waiting <b data-rvcount="Pending">0</b></span></label>
          <label><input type="radio" name="rvfilter" value="Approved"><span>On the site <b data-rvcount="Approved">0</b></span></label>
          <label><input type="radio" name="rvfilter" value="Hidden"><span>Hidden <b data-rvcount="Hidden">0</b></span></label>
          <label><input type="radio" name="rvfilter" value="All"><span>All <b data-rvcount="All">0</b></span></label>
        </div>
        <button type="button" class="btn btn-quiet btn-sm" id="rv-refresh">Refresh</button>
      </div>
      <p class="desk-note" id="rv-note" role="status" aria-live="polite" hidden></p>
      <div id="rv-list" class="res-list"></div>
      <p class="desk-empty" id="rv-empty" hidden>No reviews here yet.</p>
    </div>
  </section>

</main>

<template id="res-tpl">
  <article class="res" data-tone="light">
    <header class="res-head">
      <div class="res-id">
        <span class="res-ref num"></span>
        <span class="res-status"></span>
      </div>
      <span class="res-countdown num"></span>
    </header>

    <p class="res-trip"></p>

    <div class="route res-route">
      <div class="route-stop route-start"><span class="label">Pickup</span><p class="res-pickup"></p></div>
      <div class="route-stop route-end"><span class="label">Drop-off</span><p class="res-dropoff"></p></div>
    </div>

    <dl class="res-facts"></dl>

    <div class="res-contact">
      <span class="res-name"></span>
      <a class="res-tel btn btn-quiet btn-sm" href="#">Call</a>
      <a class="res-sms btn btn-quiet btn-sm" href="#">Text</a>
      <a class="res-mail btn btn-quiet btn-sm" href="#">Email</a>
    </div>

    <div class="res-work">
      <div class="row">
        <div class="field">
          <label>Quote <span class="opt">goes in the email</span></label>
          <input class="res-quote" type="text" inputmode="text" placeholder="e.g. $145 flat" maxlength="200">
        </div>
        <div class="field">
          <label>Note to rider <span class="opt">optional</span></label>
          <input class="res-note" type="text" placeholder="Car, pickup spot, anything" maxlength="500">
        </div>
      </div>

      <p class="res-sent" hidden></p>

      <div class="res-actions">
        <button type="button" class="btn btn-action btn-sm res-confirm">Confirm &amp; email rider</button>
        <button type="button" class="btn btn-quiet btn-sm res-quoted">Save quote</button>
        <button type="button" class="btn btn-quiet btn-sm res-decline">Decline</button>
        <button type="button" class="btn btn-quiet btn-sm res-cancel">Cancel trip</button>
        <button type="button" class="btn btn-quiet btn-sm res-resend" hidden>Resend email</button>
      </div>
      <p class="res-msg" role="alert" hidden></p>
    </div>
  </article>
</template>

<template id="rv-tpl">
  <article class="res rv" data-tone="light">
    <header class="res-head">
      <div class="res-id">
        <span class="rv-stars num"></span>
        <span class="res-status rv-status"></span>
        <span class="rv-verified" hidden>Verified ride</span>
      </div>
      <span class="rv-received num"></span>
    </header>
    <p class="rv-name"></p>
    <blockquote class="rv-text"></blockquote>
    <dl class="res-facts rv-facts"></dl>
    <div class="res-actions">
      <button type="button" class="btn btn-action btn-sm rv-approve">Show on the website</button>
      <button type="button" class="btn btn-quiet btn-sm rv-hide">Hide</button>
      <button type="button" class="btn btn-quiet btn-sm rv-pend" hidden>Back to waiting</button>
    </div>
    <p class="res-msg rv-msg" role="alert" hidden></p>
  </article>
</template>

<script src="config.js?v=2"></script>
<script src="admin.js?v=3"></script>
</body>
</html>
